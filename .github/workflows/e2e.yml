name: e2e.yml

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-website-tests:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openpyxl

      - name: Validate Selenium Test Cases Count
        run: |
          python -c "
          import openpyxl
          wb = openpyxl.load_workbook('tests/test_suites/selenium_test_cases.xlsx')
          rows = wb.active.max_row - 1
          print(f'Found {rows} test cases.')
          assert rows == 300, f'Expected 300 test cases, found {rows}'
          "

